<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroRodrigues</title>
    <link rel="stylesheet" href="style.css">
</head>

<body id="inicio">

    <header class="cabecalho">

        <div class="cabecalho-marca">
            <img 
                src="img/images.jpeg" 
                alt="Gado" 
                class="cabecalho-imagem"
            >

            <div>
                <p class="cabecalho-subtitulo">Pecuária &amp; Soja</p>
                <h1 class="cabecalho-titulo">AgroRodrigues</h1>
            </div>
        </div>

        <nav>
            <ul class="cabecalho-lista">

                <li class="cabecalho-lista-item">
                    <a href="#gado">Gado</a>
                </li>

                <li class="cabecalho-lista-item">
                    <a href="#soja">Soja</a>
                </li>

                <li class="cabecalho-lista-item">
                    <a href="#contato">Contato</a>
                </li>

            </ul>
        </nav>

        <button class="botao-tema" id="botao-tema" type="button">
            🫡 Tema
        </button>

    </header>

    <main class="galeria">

        <!-- GADO -->
        <div class="galeria-card" id="gado">

            <img 
                src="img/lida-de-gado-1024x654.jpg" 
                alt="Lida de gado" 
                class="galeria-imagem"
            >

            <p class="galeria-legenda">Gado</p>

        </div>


        <!-- SOJA -->
        <div class="galeria-card" id="soja">

            <img 
                src="img/360_F_6437597_uGMXtFVRobqOgVjQMPpOlXUj7SiesrLd.jpg" 
                alt="Soja" 
                class="galeria-imagem"
            >

            <p class="galeria-legenda">Soja</p>

        </div>


        <!-- COLHEITA -->
        <div class="galeria-card">

            <img 
                src="img/colheita-da-soja-no-brasil.jpg" 
                alt="Colheita da soja no Brasil" 
                class="galeria-imagem"
            >

            <p class="galeria-legenda">Colheita da soja</p>

        </div>

    </main>


    <!-- CONTATO -->
    <section id="contato" class="contato">

        <h2>Contato</h2>

        <p>Entre em contato com a AgroRodrigues!</p>

        <div class="contato-informacoes">

            <p>
                📞 Telefone:
                <a href="tel:+5500000000000">
                    (00) 00000-0000
                </a>
            </p>

            <p>
                📧 E-mail:
                <a href="mailto:agro@agrorodrigues.com">
                    agro@agrorodrigues.com
                </a>
            </p>

            <p>
                💬 WhatsApp:
                <a href="https://wa.me/5500000000000" target="_blank">
                    Falar no WhatsApp
                </a>
            </p>

        </div>

    </section>

</body>
</html>
